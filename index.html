<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support 17bytes</title>
<style>
  :root {
    --ink: #16181c;
    --paper: #fafaf8;
    --line: #e3e1da;
    --accent: #2f6f4e;
    --accent-dark: #234f38;
    --muted: #6b6e73;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 28px;
    opacity: 0;
    transform: translateY(10px);
    animation: cardIn 0.5s ease-out forwards;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 14px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 18px 0 8px;
  }
  .amounts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .amounts button {
    padding: 10px 0;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .amounts button:hover {
    border-color: var(--accent);
  }
  .amounts button:active {
    transform: scale(0.96);
  }
  .amounts button.active {
    border-color: var(--accent);
    background: #eaf3ee;
    color: var(--accent-dark);
    font-weight: 600;
  }
  input[type="number"], input[type="text"], input[type="email"], input[type="tel"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pay-btn {
    width: 100%;
    margin-top: 26px;
    padding: 13px 0;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .pay-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .pay-btn:hover:not(:disabled) { background: var(--accent-dark); }
  .pay-btn:active:not(:disabled) { transform: scale(0.98); }
  #status {
    margin-top: 16px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  #status.error { color: #b3261e; }
  #status.success {
    color: var(--accent-dark);
    font-weight: 600;
    animation: statusIn 0.3s ease-out;
  }
  @keyframes statusIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .checkmark {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  .checkmark circle {
    stroke: var(--accent);
    stroke-width: 2;
    fill: none;
    stroke-dasharray: 63;
    stroke-dashoffset: 63;
    animation: circleDraw 0.4s ease-out forwards;
  }
  .checkmark path {
    stroke: var(--accent-dark);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    animation: tickDraw 0.25s ease-out 0.35s forwards;
  }
  @keyframes circleDraw { to { stroke-dashoffset: 0; } }
  @keyframes tickDraw { to { stroke-dashoffset: 0; } }
  .footnote {
    margin-top: 22px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Support 17bytes</h1>
  <p class="sub">Your contribution helps keep 17bytes running. Payments are processed securely by Razorpay.</p>

  <label>Choose an amount (INR)</label>
  <div class="amounts" id="amountButtons">
    <button type="button" data-amount="100">₹100</button>
    <button type="button" data-amount="500">₹500</button>
    <button type="button" data-amount="1000">₹1000</button>
  </div>

  <label for="customAmount">Or enter a custom amount</label>
  <input type="number" id="customAmount" min="1" placeholder="e.g. 250" />

  <label for="name">Name</label>
  <input type="text" id="name" placeholder="Your name" />

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="you@example.com" />

  <label for="phone">Phone</label>
  <input type="tel" id="phone" placeholder="10-digit mobile number" />

  <button class="pay-btn" id="payBtn">Donate</button>
  <div id="status"></div>

  <p class="footnote">You'll be redirected to Razorpay's secure checkout to complete payment.</p>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  const amountButtons = document.querySelectorAll('#amountButtons button');
  const customAmount = document.getElementById('customAmount');
  const payBtn = document.getElementById('payBtn');
  const statusEl = document.getElementById('status');

  let selectedAmount = 100;
  amountButtons[0].classList.add('active');

  amountButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      amountButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedAmount = parseInt(btn.dataset.amount, 10);
      customAmount.value = '';
    });
  });

  customAmount.addEventListener('input', () => {
    amountButtons.forEach(b => b.classList.remove('active'));
    selectedAmount = parseInt(customAmount.value, 10) || 0;
  });

  function setStatus(msg, type) {
    statusEl.className = type || '';
    if (type === 'success') {
      statusEl.innerHTML = `
        <svg class="checkmark" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M7 12.5l3 3 7-7"></path>
        </svg>
        <span>${msg}</span>`;
    } else {
      statusEl.textContent = msg;
    }
  }

  payBtn.addEventListener('click', async () => {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();

    if (!selectedAmount || selectedAmount < 1) {
      setStatus('Please choose or enter a valid amount.', 'error');
      return;
    }
    if (!name || !email || !phone) {
      setStatus('Please fill in your name, email and phone.', 'error');
      return;
    }

    payBtn.disabled = true;
    setStatus('Creating order…');

    try {
      const orderRes = await fetch('/api/create-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: selectedAmount })
      });

      const rawText = await orderRes.text();
      let order;
      try {
        order = JSON.parse(rawText);
      } catch (parseErr) {
        console.error('Non-JSON response from /api/create-order:', rawText);
        throw new Error(
          orderRes.status === 404
            ? 'API route not found (404). The functions folder may not be deployed correctly.'
            : `Server returned an unexpected response (status ${orderRes.status}). Check the browser console for details.`
        );
      }

      if (!orderRes.ok) {
        throw new Error(order.error || 'Could not create order');
      }

      const options = {
        key: order.keyId,
        amount: order.amount,
        currency: order.currency,
        name: '17bytes',
        description: 'Donation to 17bytes',
        order_id: order.id,
        prefill: { name, email, contact: phone },
        theme: { color: '#2f6f4e' },
        handler: async function (response) {
          setStatus('Verifying payment…');
          try {
            const verifyRes = await fetch('/api/verify-payment', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(response)
            });
            const verifyRawText = await verifyRes.text();
            let verifyData;
            try {
              verifyData = JSON.parse(verifyRawText);
            } catch {
              console.error('Non-JSON response from /api/verify-payment:', verifyRawText);
              throw new Error('Verification endpoint returned an unexpected response.');
            }
            if (verifyRes.ok && verifyData.verified) {
              setStatus('Thank you! Your donation was received.', 'success');
            } else {
              setStatus('Payment could not be verified. If money was deducted, contact support.', 'error');
            }
          } catch (e) {
            setStatus('Verification failed. If money was deducted, contact support.', 'error');
          } finally {
            payBtn.disabled = false;
          }
        },
        modal: {
          ondismiss: function () {
            setStatus('Payment cancelled.', 'error');
            payBtn.disabled = false;
          }
        }
      };

      const rzp = new Razorpay(options);
      rzp.on('payment.failed', function (resp) {
        setStatus('Payment failed: ' + (resp.error && resp.error.description ? resp.error.description : 'Unknown error'), 'error');
        payBtn.disabled = false;
      });
      rzp.open();
    } catch (err) {
      setStatus(err.message || 'Something went wrong. Please try again.', 'error');
      payBtn.disabled = false;
    }
  });
</script>

</body>
</html>
